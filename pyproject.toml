[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-lakehouse-recsys"
version = "0.3.0"
description = "End-to-End Multimodal Visual Search & Real-Time Personalized Fashion Recommendation System on Lakehouse Architecture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pyarrow>=15.0.0",
    "polars>=1.0.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "qdrant-client>=1.9.0",
    "redis>=5.0.0",
    "kafka-python-ng>=2.2.2",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "streamlit>=1.35.0",
    "pillow>=10.2.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
spark = [
    "pyspark==3.5.3",
    "delta-spark==3.2.1",
]
cv = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.40.0",
    "open-clip-torch>=2.24.0",
    "ultralytics>=8.3.0",
    "onnx>=1.16.0",
    "onnxruntime-gpu>=1.18.0",
    "datasets>=2.19.0",
]
dev = [
    "pytest>=8.1.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

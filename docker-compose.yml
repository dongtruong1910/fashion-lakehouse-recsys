# docker-compose.yml — Hạ tầng Lakehouse, Streaming & Serving (Plan v3)
# Chạy mặc định (Qdrant + Redis + Kafka KRaft + Kafka-UI): docker compose up -d
# Chạy kèm MinIO S3 (khi cần benchmark S3A): docker compose --profile s3 up -d

services:
  # 1. Vector Database (Lưu 105.100 vector visual_emb + two_tower_emb)
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: fashion-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./volumes/qdrant:/qdrant/storage
    mem_limit: 2g
    restart: unless-stopped

  # 2. Online Feature Store & Real-time Session Cache
  redis:
    image: redis:7.4-alpine
    container_name: fashion-redis
    command: redis-server --maxmemory 768mb --maxmemory-policy allkeys-lru --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./volumes/redis:/data
    mem_limit: 900m
    restart: unless-stopped

  # 3. Apache Kafka (KRaft Mode — Đã cấu hình Dual Listeners chuẩn: INTERNAL:29092 & EXTERNAL:9092)
  kafka:
    image: apache/kafka:3.9.0
    container_name: fashion-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL dùng cho các container (kafka-ui, api); EXTERNAL dùng cho máy host/WSL2 (PySpark, Simulator)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms512M"
    volumes:
      - ./volumes/kafka:/var/lib/kafka/data
    mem_limit: 1536m
    restart: unless-stopped

  # 4. Giao diện quản lý Kafka (kafbat/kafka-ui nối qua cổng INTERNAL 29092)
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: fashion-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: fashion-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    mem_limit: 512m
    restart: unless-stopped

  # 5. Object Storage S3-compatible (Tùy chọn qua --profile s3 để tiết kiệm 1GB RAM khi chạy bình thường)
  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    container_name: fashion-minio
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fashion_lakehouse_2026}
    volumes:
      - ./volumes/minio:/data
    mem_limit: 1g
    restart: unless-stopped
